# ==============================================================================
# RELAY Role-to-Provider & Model Configuration
# การตั้งค่าจับคู่บทบาทตัวแทน AI กับค่ายผู้ให้บริการและโมเดลที่ใช้
# ค่ายที่รองรับ (Supported Providers): claude | codex | gemini
# โมเดล (Model): ใส่ "default" เพื่อใช้ค่าเริ่มต้นของ CLI หรือระบุชื่อโมเดล เช่น
#   - สำหรับ claude : default | sonnet | opus | haiku
#   - สำหรับ gemini : default | gemini-2.5-pro | gemini-2.5-flash
#   - สำหรับ codex  : default | o3 | o4-mini | gpt-5
# ==============================================================================

# ขั้นตอนที่ 1: @po (Product Owner — การวิเคราะห์ความต้องการและสร้าง SPEC.md)
ROLE_PO="gemini"
MODEL_PO="default"

# ขั้นตอนที่ 2: @arch & @pm (System Architect & Planner — การออกแบบและสร้าง ARCH.md / PLAN.md)
ROLE_ARCH="claude"
MODEL_ARCH="default"

# ขั้นตอนที่ 3: @dev (Full-Stack Developer — การพัฒนาโค้ดและชุดทดสอบใน Git Worktree)
ROLE_DEV="claude"
MODEL_DEV="default"

# ขั้นตอนที่ 4: @qa & @sec (Quality Assurance & Security Auditor — การตรวจสอบคุณภาพและสร้าง QA_REPORT.md)
ROLE_QA="codex"
MODEL_QA="default"
