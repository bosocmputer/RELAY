# ==============================================================================
# RELAY Role-to-Provider & Model Configuration
# การตั้งค่าจับคู่บทบาทตัวแทน AI กับค่ายผู้ให้บริการและโมเดลที่ใช้
# ค่ายที่รองรับ (Supported Providers): agy | claude | codex | gemini
# โมเดล (Model): ใส่ "default" เพื่อใช้ค่าเริ่มต้นของ CLI หรือระบุชื่อโมเดล เช่น
#   - สำหรับ agy (Google AI Ultra / Antigravity CLI):
#       gemini-4-argon-high | gemini-4-argon-medium | gemini-4-argon-low
#       gemini-3.8-flash-high | gemini-3.8-flash-medium | gemini-3.8-flash-low
#       claude-opus-5-5-high | claude-opus-5-5-medium | claude-opus-5-5-low
#       claude-sonnet-5-5-high | claude-sonnet-5-5-medium | claude-sonnet-5-5-low
#       gpt-oss-120b-medium
#   - สำหรับ claude : default | sonnet | opus | haiku
#   - สำหรับ gemini : default | gemini-2.5-pro | gemini-2.5-flash (ผ่าน GEMINI_API_KEY)
#   - สำหรับ codex  : default | gpt-6.1-terra | o3 | o4-mini
# ==============================================================================

# ขั้นตอนที่ 1: @po (Product Owner — การวิเคราะห์ความต้องการและสร้าง SPEC.md)
ROLE_PO="agy"
MODEL_PO="gemini-4-argon-high"

# ขั้นตอนที่ 2: @arch & @pm (System Architect & Planner — การออกแบบและสร้าง ARCH.md / PLAN.md)
ROLE_ARCH="agy"
MODEL_ARCH="claude-opus-5-5-high"

# ขั้นตอนที่ 3: @dev (Full-Stack Developer — การพัฒนาโค้ดและชุดทดสอบใน Git Worktree)
ROLE_DEV="agy"
MODEL_DEV="claude-sonnet-5-5-high"

# ขั้นตอนที่ 4: @qa & @sec (Quality Assurance & Security Auditor — การตรวจสอบคุณภาพและสร้าง QA_REPORT.md)
ROLE_QA="codex"
MODEL_QA="gpt-6.1-terra"
